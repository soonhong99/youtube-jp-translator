version: '3.8'

services:
  # ==================== Streaming Services ====================

  # Streaming Coordinator - 스트리밍 요청 조율
  streaming-coordinator:
    build: ./services/streaming-coordinator
    container_name: streaming-coordinator
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB_STREAMING=5
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - LOG_LEVEL=INFO
      - MAX_CONCURRENT_STREAMS=10
    depends_on:
      - redis
      - kafka
    restart: unless-stopped
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8004/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Translation Worker Pool - 멀티 모델 번역 워커
  translation-worker-pool:
    build: ./services/translation-worker-pool
    container_name: translation-worker-pool
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB_WORKERS=6
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - WORKER_POOL_SIZE=5
      - CIRCUIT_BREAKER_THRESHOLD=3
      - LOG_LEVEL=INFO
    depends_on:
      - redis
      - kafka
    restart: unless-stopped
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8005/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Performance Monitor - 성능 모니터링
  performance-monitor:
    build: ./services/performance-monitor
    container_name: performance-monitor
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB_METRICS=7
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PROMETHEUS_ENDPOINT=http://prometheus:9090
      - GRAFANA_ENDPOINT=http://grafana:3000
      - LOG_LEVEL=INFO
      - METRICS_COLLECTION_INTERVAL=10
    depends_on:
      - redis
      - kafka
    restart: unless-stopped
    networks:
      - backend-network
    ports:
      - "127.0.0.1:8006:8006"  # Performance Monitor API endpoint
      - "127.0.0.1:8000:8000"  # Prometheus metrics endpoint
    command: uvicorn src.main:app --host 0.0.0.0 --port 8006
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8006/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Streaming STT Processor - 스트리밍 STT 처리
  streaming-stt-processor:
    build: ./services/streaming-stt-processor
    container_name: streaming-stt-processor
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB_STT=8
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - WHISPER_MODEL=base
      - WHISPER_POOL_SIZE=3
      - DEVICE=auto
      - DEFAULT_CHUNK_DURATION=5.0
      - DEFAULT_OVERLAP_DURATION=1.0
      - MAX_CONCURRENT_TASKS=5
      - LOG_LEVEL=INFO
    depends_on:
      - redis
      - kafka
    restart: unless-stopped
    networks:
      - backend-network
    ports:
      - "127.0.0.1:8007:8007"
    volumes:
      - youtube_audio_data:/app/downloads:ro  # 오디오 파일 공유 볼륨(Extractor/STT-API와 공용)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8007/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Whisper 모델 로딩 시간 고려

  # ==================== Monitoring Tools ====================

  # Prometheus - 메트릭 수집
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - backend-network
    profiles:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana - 시각화 대시보드
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    restart: unless-stopped
    networks:
      - backend-network
    profiles:
      - monitoring
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# ==================== Networks ====================
networks:
  backend-network:
    external: true

# ==================== Volumes ====================
volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
