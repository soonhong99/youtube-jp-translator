version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis-stt
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  youtube-extractor:
    build: ./services/youtube-extractor
    container_name: youtube-extractor-service
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - youtube_audio_data:/app/downloads
    environment:
      - OUTPUT_DIR=/app/downloads
    restart: unless-stopped

  stt-processor-api:
    build:
      context: ./services/stt-processor
      args:
        MODEL_SIZE: base
    container_name: stt-processor-api
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - youtube_audio_data:/app/downloads
      - faster_whisper_models:/app/models
    environment:
      - MODEL_DIR=/app/models
      - MODEL_SIZE=base
      - DEVICE=cpu
      - COMPUTE_TYPE=int8
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_DB_WS_MESSAGES=3
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
      - kafka
    restart: unless-stopped
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001

  stt-processor-worker:
    build:
      context: ./services/stt-processor
      args:
        MODEL_SIZE: base
    container_name: stt-processor-worker
    volumes:
      - youtube_audio_data:/app/downloads
      - faster_whisper_models:/app/models
    environment:
      - MODEL_DIR=/app/models
      - MODEL_SIZE=base
      - DEVICE=cpu
      - COMPUTE_TYPE=int8
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
    depends_on:
      - kafka
      - stt-processor-api
    restart: unless-stopped
    command: python src/consumer.py

  # tts-synthesizer:
  #   build: ./services/tts-synthesizer
  #   container_name: backend-tts-synthesizer-1
  #   ports:
  #     - "8010:8000"         # 호스트 8010 → 컨테이너 내부 8000
  #   volumes:
  #     - ./services/tts-synthesizer/.env:/app/.env   # 환경변수 공유
  #     - ./services/tts-synthesizer/src:/app/src     # 소스 코드 공유 (개발 편의를 위해)
  #     - ./services/tts-synthesizer/config:/app/config
  #     - ./services/tts-synthesizer/requirements.txt:/app/requirements.txt
  #   environment:
  #     - PYTHONUNBUFFERED=1
  #   restart: unless-stopped

  tts-synthesizer:
    build: ./services/tts-synthesizer
    container_name: backend-tts-synthesizer-1
    ports:
      - "8010:8000"
    volumes:
      - ./services/tts-synthesizer/src:/app/src
      - ./services/tts-synthesizer/config:/app/config
      # 필요 시 .env 마운트:
      # - ./backend/.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

volumes:
  kafka_data:
  youtube_audio_data:
  faster_whisper_models:
  redis_data:
