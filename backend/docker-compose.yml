version: '3.8'

services:
  # Redis 서비스 추가
  redis:
    image: redis:7-alpine # 특정 버전 사용 권장
    container_name: redis-stt
    ports:
      - "127.0.0.1:6379:6379" # 로컬에서만 접근하도록 설정 (보안 강화)
    volumes:
      - redis_data:/data # 데이터 영속성 (선택 사항)
    restart: unless-stopped

  # 기존 youtube-extractor 서비스
  youtube-extractor:
    build: ./services/youtube-extractor
    container_name: youtube-extractor-service
    ports:
      - "127.0.0.1:8000:8000" # 로컬에서만 접근
    volumes:
      - youtube_audio_data:/app/downloads
    environment:
      - OUTPUT_DIR=/app/downloads
    restart: unless-stopped

  # STT Processor API 서비스 (Celery 연동 설정 추가)
  stt-processor-api:
    build:
      context: ./services/stt-processor
      args:
        MODEL_SIZE: base # 빌드 시 모델 크기 지정
    container_name: stt-processor-api
    ports:
      - "127.0.0.1:8001:8001" # 로컬에서만 접근
    volumes:
      - youtube_audio_data:/app/downloads # 오디오 공유 볼륨
      - faster_whisper_models:/app/models # 모델 볼륨
    environment:
      - MODEL_DIR=/app/models
      - MODEL_SIZE=base
      - DEVICE=cpu # 또는 cuda
      - COMPUTE_TYPE=int8 # 또는 float16 등
      - REDIS_HOST=redis # Celery 브로커 호스트 (서비스 이름)
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1 # 로그 즉시 출력
    depends_on: # Redis가 먼저 실행되어야 함
      - redis
    restart: unless-stopped
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001 # --reload 옵션은 개발 시에만

  # STT Processor Celery Worker 서비스 추가
  stt-processor-worker:
    build:
      context: ./services/stt-processor # API와 동일한 이미지 사용
      args:
        MODEL_SIZE: base
    container_name: stt-processor-worker
    # 워커는 외부 포트 노출 불필요
    volumes: # API와 동일한 볼륨 마운트 필요
      - youtube_audio_data:/app/downloads
      - faster_whisper_models:/app/models
    environment: # API와 동일한 환경 변수 + Worker 관련 설정
      - MODEL_DIR=/app/models
      - MODEL_SIZE=base
      - DEVICE=cpu # 또는 cuda
      - COMPUTE_TYPE=int8
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
      # - NVIDIA_VISIBLE_DEVICES=all # GPU 사용 시
    depends_on:
      - redis
      # - stt-processor-api # API 실행 후 워커 시작 (선택 사항)
    restart: unless-stopped
    # Celery 워커 실행 명령어
    # -A: Celery 앱 위치 지정, worker: 워커 모드, --loglevel: 로그 레벨
    # -c: 동시성 (Worker 프로세스 수). CPU bound 작업은 CPU 코어 수, GPU 작업은 보통 1
    command: celery -A src.celery_app worker --loglevel=info -c 1 -Q priority_queue,celery
    # GPU 사용 및 확장성 필요 시 deploy 섹션 활용
    # deploy:
    #   replicas: 2 # 워커 컨테이너 2개 실행
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

# 볼륨 정의
volumes:
  redis_data:
  youtube_audio_data:
  faster_whisper_models: