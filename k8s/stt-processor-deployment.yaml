apiVersion: v1
kind: Service
metadata:
  name: stt-processor-api-service
  namespace: youtube-translator
  labels:
    app: stt-processor-api
spec:
  ports:
  - port: 8001
    targetPort: 8001
    name: http
  selector:
    app: stt-processor-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-processor-api
  namespace: youtube-translator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stt-processor-api
  template:
    metadata:
      labels:
        app: stt-processor-api
    spec:
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - youtube-extractor
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        kubernetes.io/hostname: youtube-translator-cluster-worker2
      containers:
      - name: stt-processor-api
        image: stt-processor:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8001"]
        env:
        - name: MODEL_DIR
          value: "/app/models"
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: kafka-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-secret
              key: api-key
        - name: GEMINI_MODEL
          valueFrom:
            configMapKeyRef:
              name: ai-orchestrator-config
              key: GEMINI_MODEL
        - name: GEMINI_TEMPERATURE
          valueFrom:
            configMapKeyRef:
              name: ai-orchestrator-config
              key: GEMINI_TEMPERATURE
        envFrom:
        - configMapRef:
            name: stt-processor-config
        - configMapRef:
            name: redis-config
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - name: youtube-audio-storage
          mountPath: /app/downloads
        - name: whisper-models-storage
          mountPath: /app/models
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: youtube-audio-storage
        persistentVolumeClaim:
          claimName: youtube-audio-pvc
      - name: whisper-models-storage
        persistentVolumeClaim:
          claimName: whisper-models-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-processor-worker
  namespace: youtube-translator
spec:
  replicas: 1  # dev 환경: 단일 워커로 시작
  selector:
    matchLabels:
      app: stt-processor-worker
  template:
    metadata:
      labels:
        app: stt-processor-worker
    spec:
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - youtube-extractor
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        kubernetes.io/hostname: youtube-translator-cluster-worker2
      containers:
      - name: stt-processor-worker
        image: stt-processor:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "src.worker"]
        env:
        - name: MODEL_DIR
          value: "/app/models"
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: kafka-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-secret
              key: api-key
        - name: GEMINI_MODEL
          valueFrom:
            configMapKeyRef:
              name: ai-orchestrator-config
              key: GEMINI_MODEL
        - name: GEMINI_TEMPERATURE
          valueFrom:
            configMapKeyRef:
              name: ai-orchestrator-config
              key: GEMINI_TEMPERATURE
        envFrom:
        - configMapRef:
            name: stt-processor-config
        - configMapRef:
            name: redis-config
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1500m
            memory: 3Gi
        volumeMounts:
        - name: youtube-audio-storage
          mountPath: /app/downloads
        - name: whisper-models-storage
          mountPath: /app/models
        - name: stt-chunks-tmp
          mountPath: /tmp
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "print('alive')"
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - "print('ready')"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: youtube-audio-storage
        persistentVolumeClaim:
          claimName: youtube-audio-pvc
      - name: whisper-models-storage
        persistentVolumeClaim:
          claimName: whisper-models-pvc
      - name: stt-chunks-tmp
        emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stt-processor-worker-hpa
  namespace: youtube-translator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stt-processor-worker
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: youtube-audio-pvc
  namespace: youtube-translator
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: shared-storage
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whisper-models-pvc
  namespace: youtube-translator
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: shared-storage
  resources:
    requests:
      storage: 5Gi