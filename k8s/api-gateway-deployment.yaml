apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: youtube-translator
  labels:
    app: api-gateway
spec:
  type: LoadBalancer  # 외부 접근을 위한 LoadBalancer
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: youtube-translator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: api-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: kafka-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: redis-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: redis-config
              key: REDIS_PORT
        - name: LOG_LEVEL
          value: "INFO"
        envFrom:
        - configMapRef:
            name: api-gateway-config
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: youtube-extractor-service
  namespace: youtube-translator
  labels:
    app: youtube-extractor
spec:
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: youtube-extractor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtube-extractor
  namespace: youtube-translator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: youtube-extractor
  template:
    metadata:
      labels:
        app: youtube-extractor
    spec:
      containers:
      - name: youtube-extractor
        image: youtube-extractor:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: OUTPUT_DIR
          value: "/app/downloads"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        volumeMounts:
        - name: youtube-audio-storage
          mountPath: /app/downloads
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: youtube-audio-storage
        persistentVolumeClaim:
          claimName: youtube-audio-pvc
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  namespace: youtube-translator
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/websocket-services: "api-gateway-service"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
  - host: youtube-translator.local  # 개발 환경용 호스트
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway-service
            port:
              number: 8080
  # 운영 환경을 위한 TLS 설정 (선택사항)
  # tls:
  # - hosts:
  #   - youtube-translator.example.com
  #   secretName: youtube-translator-tls