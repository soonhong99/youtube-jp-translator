apiVersion: v1
kind: Secret
metadata:
  name: gemini-secret
  namespace: youtube-translator
type: Opaque
stringData:
  api-key: "PLACEHOLDER_GEMINI_API_KEY"  # 실제 배포 시 교체 필요
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: youtube-translator
type: Opaque
stringData:
  password: "redis-production-password"  # 운영 환경용 비밀번호
---
# Note: 실제 배포 시에는 다음 명령어로 secret 생성 권장:
# kubectl create secret generic gemini-secret \
#   --from-literal=api-key="YOUR_ACTUAL_GEMINI_API_KEY" \
#   -n youtube-translator