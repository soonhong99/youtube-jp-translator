apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: youtube-audio-pvc
  namespace: youtube-translator
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: shared-storage
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whisper-models-pvc
  namespace: youtube-translator
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: shared-storage
  resources:
    requests:
      storage: 5Gi