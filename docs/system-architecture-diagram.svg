<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 및 기본 스타일 -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e1f5fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b3e5fc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="extractorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e1bee7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe0b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="kafkaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f9fbe7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f4c3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffebee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffcdd2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 컴포넌트 정의 -->
  <!-- 1. React Client -->
  <rect x="50" y="100" width="150" height="90" rx="10" ry="10" fill="url(#clientGrad)" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
  <text x="125" y="145" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">React Client</text>
  <text x="125" y="165" font-family="Arial" font-size="12" text-anchor="middle">Browser / Frontend</text>

  <!-- 2. YouTube Extractor -->
  <rect x="300" y="60" width="160" height="90" rx="10" ry="10" fill="url(#extractorGrad)" stroke="#9C27B0" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="105" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">YouTube Extractor</text>
  <text x="380" y="125" font-family="Arial" font-size="12" text-anchor="middle">FastAPI Service</text>

  <!-- 3. STT API -->
  <rect x="300" y="200" width="160" height="90" rx="10" ry="10" fill="url(#apiGrad)" stroke="#4CAF50" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="245" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">STT API Service</text>
  <text x="380" y="265" font-family="Arial" font-size="12" text-anchor="middle">Task Management</text>

  <!-- 4. STT Worker -->
  <rect x="300" y="340" width="160" height="90" rx="10" ry="10" fill="url(#workerGrad)" stroke="#FF9800" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="385" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">STT Worker</text>
  <text x="380" y="405" font-family="Arial" font-size="12" text-anchor="middle">Faster-Whisper</text>

  <!-- 5. Kafka Topics -->
  <rect x="550" y="150" width="200" height="80" rx="10" ry="10" fill="url(#kafkaGrad)" stroke="#827717" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="185" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Kafka</text>
  <text x="650" y="205" font-family="Arial" font-size="12" text-anchor="middle">stt_requests / stt_results</text>

  <!-- 6. Redis History -->
  <rect x="600" y="300" width="150" height="80" rx="10" ry="10" fill="url(#redisGrad)" stroke="#D32F2F" stroke-width="2" filter="url(#shadow)"/>
  <text x="675" y="340" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Redis</text>
  <text x="675" y="360" font-family="Arial" font-size="12" text-anchor="middle">Message History</text>

  <!-- 7. WebSocket Manager -->
  <rect x="550" y="430" width="200" height="80" rx="10" ry="10" fill="url(#wsGrad)" stroke="#1976D2" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="470" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">WebSocket Manager</text>
  <text x="650" y="490" font-family="Arial" font-size="12" text-anchor="middle">실시간 업데이트 전송</text>

  <!-- 연결선 및 흐름 -->
  <!-- 1. Client to Extractor -->
  <path d="M200 115 C240 115, 260 95, 300 95" stroke="#2196F3" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="230" y="85" font-family="Arial" font-size="10" text-anchor="middle">1. POST /extract (URL)</text>

  <!-- 2. Extractor to Client -->
  <path d="M300 125 C260 125, 240 145, 200 145" stroke="#9C27B0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="230" y="160" font-family="Arial" font-size="10" text-anchor="middle">2. Response (File Path)</text>

  <!-- 3. Client to STT API -->
  <path d="M200 160 C240 160, 260 200, 300 220" stroke="#2196F3" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="200" y="190" font-family="Arial" font-size="10" text-anchor="middle">3. POST /request_transcription</text>

  <!-- 4. STT API to Kafka -->
  <path d="M460 220 C500 220, 520 200, 550 190" stroke="#4CAF50" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="505" y="210" font-family="Arial" font-size="10" text-anchor="middle">4. Produce Request</text>

  <!-- 5. STT API to Client -->
  <path d="M300 245 C260 245, 240 185, 200 170" stroke="#4CAF50" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="230" y="225" font-family="Arial" font-size="10" text-anchor="middle">5. Response (Task ID)</text>

  <!-- 6. Kafka to Worker -->
  <path d="M550 190 C520 190, 500 365, 460 365" stroke="#827717" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="500" y="290" font-family="Arial" font-size="10" text-anchor="middle">6. Consume Request</text>

  <!-- 7. Client to WebSocket -->
  <path d="M125 190 L125 470 C125 480, 135 490, 145 490 L550 490" stroke="#2196F3" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text x="180" y="510" font-family="Arial" font-size="10" text-anchor="middle">7. WebSocket Connection</text>

  <!-- 8. Worker Self-Processing -->
  <path d="M380 430 C380 450, 460 450, 460 430 C460 410, 420 410, 420 390" stroke="#FF9800" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="425" y="470" font-family="Arial" font-size="10" text-anchor="middle">8. Process STT (Chunks)</text>

  <!-- 9. Worker to Kafka -->
  <path d="M460 365 C500 365, 520 230, 550 210" stroke="#FF9800" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="520" y="320" font-family="Arial" font-size="10" text-anchor="middle">9. Produce Results</text>

  <!-- 10. Kafka to Redis -->
  <path d="M650 230 L650 300" stroke="#827717" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="665" y="270" font-family="Arial" font-size="10" text-anchor="middle">10. Save History</text>

  <!-- 11. Kafka to WebSocket -->
  <path d="M650 230 C650 250, 700 350, 650 430" stroke="#827717" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="700" y="370" font-family="Arial" font-size="10" text-anchor="middle">11. Forward Results</text>

  <!-- 12. WebSocket to Client -->
  <path d="M550 470 L145 470 C135 470, 125 460, 125 450 L125 190" stroke="#1976D2" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text x="300" y="450" font-family="Arial" font-size="10" text-anchor="middle">12. Push Updates to Client</text>

  <!-- 화살표 마커 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">YouTube 일본어 STT 및 번역 시스템 아키텍처</text>
</svg>
